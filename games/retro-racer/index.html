<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Racer 3D - Midnight Neon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- Back to Arena Hub Link -->
        <a class="back-link" href="../../index.html">← Back to Arena</a>

        <h1>RETRO RACER 3D</h1>
        <p>Use ← → or A / D to change lanes</p>

        <div class="stats">
            <div id="score">SCORE: 0</div>
            <div id="coins">COINS: 0</div>
            <div id="speed">SPEED: 4</div>
        </div>
    </header>

    <main id="game-container">
        <div id="message">
            <h2 id="message-title">PAUSED</h2>
            <p id="message-text">Press Resume to continue</p>
        </div>
    </main>

    <footer class="controls">
        <button id="pause-btn">Pause</button>
        <button id="resume-btn">Resume</button>
        <button id="restart-btn">Restart</button>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
